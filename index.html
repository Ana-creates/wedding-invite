<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Save the Date — Liza &amp; Tornike</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --maroon: #500105;
    --maroon-dark: #2A0103;
    --olive: #6A7D46;
    --olive-dark: #333D1F;
    --cream: #FBF6EC;
    --grad-top: #EAE6E0;
    --grad-bottom: #D6D1CB;
    --ink: #33291f;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: #EAE2D5;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* ---------- Curtain gate ---------- */

  html.curtain-locked, html.curtain-locked body {
    overflow: hidden;
    height: 100%;
  }

  .curtain-gate {
    position: fixed;
    inset: 0;
    z-index: 200;
    overflow: hidden;
    perspective: 1600px;
  }

  .curtain-gate.is-open {
    pointer-events: none;
  }

  .curtain-panel {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background-image: url('assets/curtain-mobile.webp');
    background-size: 200% 100%;
    background-repeat: no-repeat;
    transition: transform 1.35s cubic-bezier(0.76, 0, 0.24, 1);
    box-shadow: 0 0 60px rgba(0,0,0,0.35);
  }

  @media (min-width: 768px) {
    .curtain-panel { background-image: url('assets/curtain-web.webp'); }
  }

  .curtain-left {
    left: 0;
    background-position: left top;
    transform-origin: left center;
  }

  .curtain-right {
    right: 0;
    background-position: right top;
    transform-origin: right center;
  }

  .curtain-gate.is-open .curtain-left {
    transform: translateX(-102%) rotateY(-18deg) scale(1.04);
  }

  .curtain-gate.is-open .curtain-right {
    transform: translateX(102%) rotateY(18deg) scale(1.04);
    transition-delay: 0.07s;
  }

  .curtain-flare {
    position: absolute;
    top: 38%;
    left: 50%;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,238,215,0.95), rgba(255,170,140,0.35) 45%, transparent 72%);
    transform: translate(-50%, -50%) scale(0.3);
    opacity: 0;
    z-index: 1;
    pointer-events: none;
  }

  .curtain-gate.is-open .curtain-flare {
    animation: flare-burst 1.3s ease-out forwards;
  }

  @keyframes flare-burst {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    35% { opacity: 1; transform: translate(-50%, -50%) scale(2.6); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(4.2); }
  }

  .curtain-cta {
    position: absolute;
    left: 50%;
    bottom: 14%;
    transform: translateX(-50%);
    background: none;
    border: 1px solid rgba(251,246,236,0.55);
    border-radius: 999px;
    padding: 13px 28px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #FBF6EC;
    cursor: pointer;
    z-index: 3;
    animation: pulse 2.6s ease-in-out infinite;
    transition: opacity 0.35s ease;
  }

  .curtain-gate.is-open .curtain-cta {
    animation: none;
    opacity: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }

  @media (max-width: 480px) {
    .curtain-cta { bottom: 10%; padding: 12px 22px; font-size: 11px; }
  }

  /* ---------- Hero ---------- */

  .hero {
    position: relative;
  }

  .hero-sticky {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    text-align: center;
  }

  .hero-sticky::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(ellipse at 50% 0%, rgba(80,1,5,0.05), transparent 60%), url('assets/hero-frame-bg-mobile.webp');
    background-size: auto, cover;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
  }

  @media (min-width: 768px) {
    .hero-sticky::before { background-image: radial-gradient(ellipse at 50% 0%, rgba(80,1,5,0.05), transparent 60%), url('assets/hero-frame-bg.webp'); }
  }

  .hero-sticky > * {
    position: relative;
    z-index: 1;
  }

  .hero-headline {
    font-family: 'Pinyon Script', cursive;
    font-weight: 400;
    font-size: 124px;
    line-height: 1;
    color: #FFFDF9;
    text-shadow: 0 2px 3px rgba(80,1,5,0.10), 0 1px 0 rgba(255,255,255,0.6);
    margin: 0 0 28px;
  }

  .hero-headline .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(28px) rotate(-5deg);
    animation: letter-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes letter-in {
    to { opacity: 1; transform: translateY(0) rotate(0deg); }
  }

  .hero-plaque-wrap {
    position: relative;
    width: min(86vw, 480px);
    opacity: 0;
    transform: translateY(18px) scale(0.98);
    animation: rise-scale 1.1s ease-out 0.55s forwards;
  }

  .hero-card-layer {
    position: relative;
    z-index: 2;
    width: 100%;
    will-change: transform;
  }

  .hero-plaque {
    display: block;
    width: 100%;
    height: auto;
  }

  .hero-envelope-layer {
    position: absolute;
    top: -8%;
    right: -34%;
    width: 96%;
    z-index: 1;
    opacity: 0;
    transform: rotate(6deg) scale(0.92);
    animation: hero-envelope-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
  }

  .hero-envelope-layer img {
    display: block;
    width: 100%;
    height: auto;
  }

  @keyframes hero-envelope-in {
    to { opacity: 1; transform: rotate(0deg) scale(1); }
  }

  .hero-floral-pin {
    position: absolute;
    right: -6%;
    bottom: 0;
    width: min(46vw, 420px);
    z-index: 3;
    pointer-events: none;
  }

  .hero-floral {
    display: block;
    width: 100%;
    opacity: 0;
    transform-origin: 30% 90%;
    transform: rotate(-22deg) scale(0.75);
    animation: hero-floral-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
  }

  .hero-floral img {
    display: block;
    width: 100%;
    height: auto;
    animation: sway 8s ease-in-out 2s infinite;
  }

  @keyframes hero-floral-in {
    to { opacity: 1; transform: rotate(-13deg) scale(1); }
  }

  .hero-champagne-pin {
    position: absolute;
    left: -6%;
    bottom: 16%;
    width: min(34vw, 290px);
    z-index: 3;
    pointer-events: none;
  }

  .hero-champagne {
    display: block;
    width: 100%;
    opacity: 0;
    transform-origin: 50% 100%;
    transform: rotate(-14deg) scale(0.75);
    animation: hero-champagne-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
  }

  .hero-champagne img {
    display: block;
    width: 100%;
    height: auto;
  }

  @keyframes hero-champagne-in {
    to { opacity: 1; transform: rotate(-4deg) scale(1); }
  }

  .hero-vinyl-pin {
    position: absolute;
    left: 4%;
    bottom: 44%;
    width: min(23vw, 200px);
    z-index: 4;
    pointer-events: none;
  }

  .hero-vinyl-hero {
    display: block;
    width: 100%;
    opacity: 0;
    transform: rotate(30deg) scale(0.75);
    animation: hero-vinyl-hero-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 1.25s forwards;
  }

  .hero-vinyl-hero img {
    display: block;
    width: 100%;
    height: auto;
    animation: vinyl-spin 9s linear infinite;
  }

  @keyframes hero-vinyl-hero-in {
    to { opacity: 0.94; transform: rotate(12deg) scale(1); }
  }

  .hero-cake-pin {
    position: absolute;
    right: -4%;
    top: 4%;
    width: min(24vw, 210px);
    z-index: 3;
    pointer-events: none;
  }

  .hero-cake {
    display: block;
    width: 100%;
    opacity: 0;
    transform-origin: 50% 100%;
    transform: rotate(16deg) scale(0.75);
    animation: hero-cake-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 1.45s forwards;
  }

  .hero-cake img {
    display: block;
    width: 100%;
    height: auto;
  }

  @keyframes hero-cake-in {
    to { opacity: 1; transform: rotate(6deg) scale(1); }
  }


  .hero-orchid {
    position: absolute;
    top: -4%;
    left: -14%;
    width: 46%;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transform-origin: 20% 70%;
    will-change: transform, opacity;
  }

  .hero-orchid img {
    display: block;
    width: 100%;
    height: auto;
    mix-blend-mode: multiply;
    animation: sway 9s ease-in-out 2.2s infinite;
  }

  @keyframes vinyl-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes fan-wave {
    0%, 100% { transform: rotate(-7deg); }
    50% { transform: rotate(7deg); }
  }

  .hero-scroll-cue {
    margin-top: 40px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(51,41,31,0.45);
    opacity: 0;
    animation: fade-in 1s ease-out 2.2s forwards;
  }

  @keyframes rise-scale {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fade-in {
    to { opacity: 1; }
  }

  @media (max-width: 480px) {
    .hero-headline {
      font-size: clamp(38px, 12vw, 64px);
      white-space: nowrap;
    }
    .hero-floral-pin { width: 30vw; right: -3%; bottom: -2%; }
    .hero-champagne-pin { width: 18vw; left: -3%; bottom: 2%; }
    .hero-vinyl-pin { width: 13vw; left: 2%; top: 2%; }
    .hero-cake-pin { width: 15vw; right: -2%; top: 2%; }
  }

  /* ---------- Scroll-reveal (shared) ---------- */

  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.8s ease-out, transform 0.8s ease-out;
  }

  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- RSVP ---------- */

  .rsvp-wrap {
    position: relative;
    text-align: center;
    padding: 0 32px 116px;
    margin-bottom: 64px;
  }

  .rsvp-drape-spacer {
    width: 100%;
    aspect-ratio: 1600 / 512;
  }

  .rsvp-wrap::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    aspect-ratio: 1600 / 512;
    background-image: url('assets/drapery.webp');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    z-index: 0;
  }

  @media (max-width: 480px) {
    .rsvp-drape-spacer { aspect-ratio: auto; height: 240px; }
    .rsvp-wrap::before { aspect-ratio: auto; height: 240px; background-size: cover; background-position: center; }
    .rsvp-headline { margin-top: -170px; }
  }

  .rsvp-wrap > * {
    position: relative;
    z-index: 1;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(6deg) scale(1); }
    50% { transform: rotate(2deg) scale(1.015); }
  }

  .rsvp-headline {
    font-family: 'Pinyon Script', cursive;
    font-weight: 400;
    font-size: 64px;
    color: var(--cream);
    margin: -23% 0 14px;
  }

  .rsvp-question {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 21px;
    margin: 0 0 40px;
    color: rgba(251,246,236,0.9);
  }

  .rsvp-toggle {
    position: relative;
    display: inline-flex;
    background: rgba(251,246,236,0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(251,246,236,0.3);
    border-radius: 999px;
    padding: 6px;
    max-width: 100%;
    overflow: hidden;
  }

  .rsvp-toggle-thumb {
    position: absolute;
    top: 6px;
    bottom: 6px;
    left: 6px;
    width: 0;
    background: var(--cream);
    border-radius: 999px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), width 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    opacity: 0;
    z-index: 0;
  }

  .rsvp-toggle.has-selection .rsvp-toggle-thumb {
    opacity: 1;
  }

  .rsvp-btn {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 14px 22px;
    background: none;
    border: none;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    white-space: nowrap;
    color: var(--cream);
    cursor: pointer;
    transition: color 0.35s ease;
  }

  .rsvp-icon {
    width: 20px;
    height: 20px;
    color: currentColor;
    flex: none;
    transition: color 0.35s ease;
  }

  .rsvp-btn.selected {
    color: var(--maroon);
  }

  @media (max-width: 380px) {
    .rsvp-btn { padding: 12px 12px; font-size: 11.5px; gap: 6px; }
    .rsvp-icon { width: 17px; height: 17px; }
  }

  .rsvp-confirm {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--cream);
    margin: 26px 0 0;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .rsvp-confirm.show {
    opacity: 1;
    transform: translateY(0);
  }

  .rsvp-stamp {
    display: block;
    width: 84px;
    height: auto;
    margin: 20px auto 0;
    opacity: 0;
    transform: scale(2.4) rotate(-22deg);
    filter: drop-shadow(0 3px 6px rgba(42,1,3,0.25));
    transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .rsvp-stamp.show {
    opacity: 1;
    transform: scale(1) rotate(-6deg);
    animation: seal-glow 2.6s ease-in-out 0.55s infinite;
  }

  @keyframes seal-glow {
    0%, 100% { filter: drop-shadow(0 3px 6px rgba(42,1,3,0.25)) brightness(1); }
    50% { filter: drop-shadow(0 3px 12px rgba(106,125,70,0.5)) brightness(1.1); }
  }

  @media (max-width: 420px) {
    .rsvp-wrap { padding: 180px 24px 80px; }
    .rsvp-headline { font-size: 42px; }
  }

  .petal {
    position: fixed;
    width: 9px;
    height: 11px;
    border-radius: 60% 60% 60% 0;
    pointer-events: none;
    z-index: 500;
    opacity: 0;
    transform: translate(-50%, -50%);
    animation: petal-burst 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes petal-burst {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(0deg); }
    15% { opacity: 1; }
    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 80px)) scale(1) rotate(var(--rot));
    }
  }

  /* ---------- Countdown ---------- */

  .countdown {
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(80,1,5,0.14);
    color: var(--ink);
    text-align: center;
    padding: 64px 24px;
    max-width: 980px;
    width: calc(100% - 32px);
    margin: 0 auto 56px;
    border-radius: 28px;
  }

  .countdown-dove {
    width: 130px;
    height: auto;
    margin: 0 0 12px;
    opacity: 0.85;
  }

  .countdown-headline {
    font-family: 'Pinyon Script', cursive;
    font-weight: 400;
    font-size: 48px;
    margin: 0 0 28px;
    color: var(--maroon);
  }

  .countdown-timer {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 18px;
    max-width: 420px;
    margin: 0 auto;
  }

  .time-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 56px;
  }

  .time-block .value {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--maroon);
    font-variant-numeric: tabular-nums;
  }

  .time-block .label {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--olive);
    margin-top: 8px;
  }

  .countdown-colon {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 30px;
    line-height: 1;
    color: rgba(80,1,5,0.25);
    padding-top: 2px;
  }

  @media (max-width: 420px) {
    .countdown-headline { font-size: 34px; }
    .countdown-timer { gap: 8px; }
    .time-block { min-width: 44px; }
    .time-block .value { font-size: 26px; }
    .time-block .label { font-size: 9px; letter-spacing: 0.12em; }
    .countdown-colon { font-size: 22px; }
  }

  /* ---------- Schedule ---------- */

  .schedule {
    background-image: url('assets/schedule-bg.webp');
    background-size: cover;
    background-position: center 30%;
    color: #F3F0E6;
    text-align: center;
    padding: 32px 24px 76px;
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    margin-top: 140px;
    margin-bottom: 56px;
  }


  .schedule-fan {
    position: absolute;
    bottom: -28%;
    right: -8%;
    width: min(38vw, 500px);
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transform-origin: 84% 86%;
    transform: rotate(-30deg) scale(0.85);
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .schedule.is-visible .schedule-fan {
    opacity: 0.9;
    transform: rotate(-14deg) scale(1);
  }

  .schedule-fan img {
    display: block;
    width: 100%;
    height: auto;
    transform-origin: 84% 86%;
    animation: fan-wave 2.4s ease-in-out 1.5s infinite;
  }

  @media (max-width: 600px) {
    .schedule-fan { width: 78vw; right: -14%; bottom: -10%; }
  }

  .schedule-headline {
    position: relative;
    z-index: 1;
    font-family: 'Pinyon Script', cursive;
    font-weight: 400;
    font-size: 46px;
    color: var(--maroon);
    margin: 0 0 24px;
  }

  .schedule-items {
    text-align: center;
    padding: 24px 24px 56px;
  }

  .schedule-list {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 44px;
    max-width: 720px;
    margin: 0 auto;
  }

  .schedule-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    flex: 1 1 160px;
    max-width: 200px;
  }

  .schedule-time {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .schedule-photo {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(80,1,5,0.25);
    box-shadow: 0 8px 18px rgba(42,1,3,0.18);
  }

  .schedule-label {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--maroon);
    text-align: center;
  }

  .schedule-venue {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(51,41,31,0.65);
    margin-top: -6px;
  }

  .schedule-flourish {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 46px;
  }

  .schedule-flourish span {
    display: block;
    width: 40px;
    height: 1px;
    background: rgba(243,240,230,0.35);
  }

  .schedule-flourish .diamond {
    width: 6px;
    height: 6px;
    background: rgba(243,240,230,0.5);
    transform: rotate(45deg);
  }

  @media (max-width: 420px) {
    .schedule-headline { font-size: 36px; }
  }


  .site-footer {
    display: flex;
    justify-content: center;
    padding: 48px 24px 64px;
  }

  .footer-seal {
    width: 96px;
    height: auto;
    opacity: 0.9;
  }


</style>
</head>
<body>

  <div class="curtain-gate" id="curtainGate">
    <div class="curtain-flare"></div>
    <div class="curtain-panel curtain-left"></div>
    <div class="curtain-panel curtain-right"></div>
    <button class="curtain-cta" id="curtainCta" type="button">Click to open the invitation</button>
  </div>

  <section class="hero" id="heroSection">

  <script>
    // ---------- Curtain gate ----------
    const curtainGate = document.getElementById('curtainGate');

    document.documentElement.classList.add('curtain-locked');

    function openCurtains() {
      curtainGate.classList.add('is-open');
      document.documentElement.classList.remove('curtain-locked');
      setTimeout(() => {
        curtainGate.style.display = 'none';
      }, 1450);
    }

    curtainGate.addEventListener('click', openCurtains);

    // ---------- RSVP ----------
    const buttons = document.querySelectorAll('.rsvp-btn');
    const confirm = document.getElementById('confirm');
    const rsvpStamp = document.getElementById('rsvpStamp');
    const rsvpToggle = document.getElementById('rsvpToggle');
    const rsvpThumb = document.getElementById('rsvpThumb');

    function moveThumbTo(btn) {
      const toggleRect = rsvpToggle.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      rsvpThumb.style.width = btnRect.width + 'px';
      rsvpThumb.style.transform = `translateX(${btnRect.left - toggleRect.left - 6}px)`;
      rsvpToggle.classList.add('has-selection');
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        moveThumbTo(btn);

        const value = btn.dataset.value;
        confirm.textContent = value === 'yes'
          ? 'Thank you — we can\'t wait to celebrate with you.'
          : 'Thank you for letting us know — you\'ll be missed.';
        confirm.classList.add('show');

        rsvpStamp.classList.remove('show');
        void rsvpStamp.offsetWidth; // restart the stamp animation if the answer changes
        rsvpStamp.classList.add('show');

        spawnPetals(btn);

        // TODO: wire this to the response-logging endpoint (Google Sheet via Apps Script)
        // once the guest list and hosting are finalized.
      });
    });

    window.addEventListener('resize', () => {
      const selected = document.querySelector('.rsvp-btn.selected');
      if (selected) moveThumbTo(selected);
    });

    // ---------- Petal burst ----------
    const petalColors = ['#500105', '#6A7D46', '#FBF6EC'];

    function spawnPetals(originEl) {
      const rect = originEl.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      for (let i = 0; i < 16; i++) {
        const petal = document.createElement('span');
        petal.className = 'petal';

        const angle = Math.random() * 360;
        const distance = 55 + Math.random() * 95;
        const dx = Math.cos(angle * Math.PI / 180) * distance;
        const dy = Math.sin(angle * Math.PI / 180) * distance - 30;

        petal.style.left = originX + 'px';
        petal.style.top = originY + 'px';
        petal.style.setProperty('--dx', dx + 'px');
        petal.style.setProperty('--dy', dy + 'px');
        petal.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
        petal.style.background = petalColors[i % petalColors.length];
        petal.style.animationDelay = (Math.random() * 0.12) + 's';

        document.body.appendChild(petal);
        petal.addEventListener('animationend', () => petal.remove());
      }
    }

    // ---------- Countdown ----------
    // Time assumed 16:00 — update if the real ceremony time differs.
    const WEDDING_DATE = new Date('2026-09-05T16:00:00');

    const dayEl = document.getElementById('cd-days');
    const hourEl = document.getElementById('cd-hours');
    const minEl = document.getElementById('cd-mins');
    const secEl = document.getElementById('cd-secs');

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function updateCountdown() {
      const diff = WEDDING_DATE.getTime() - Date.now();
      if (diff <= 0) {
        dayEl.textContent = '00';
        hourEl.textContent = '00';
        minEl.textContent = '00';
        secEl.textContent = '00';
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      dayEl.textContent = pad(days);
      hourEl.textContent = pad(hours);
      minEl.textContent = pad(minutes);
      secEl.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // ---------- Scroll reveal ----------
    const revealEls = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    revealEls.forEach(el => observer.observe(el));
  </script>
