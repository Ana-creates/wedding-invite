<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Save the Date — Liza &amp; Tornike</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --maroon: #500105;
    --maroon-dark: #2A0103;
    --olive: #6A7D46;
    --olive-dark: #333D1F;
    --cream: #FBF6EC;
    --grad-top: #EAE6E0;
    --grad-bottom: #D6D1CB;
    --ink: #33291f;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: linear-gradient(180deg, var(--grad-top), var(--grad-bottom));
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }

  /* ---------- Curtain gate ---------- */

  html.curtain-locked, html.curtain-locked body {
    overflow: hidden;
    height: 100%;
  }

  .curtain-gate {
    position: fixed;
    inset: 0;
    z-index: 200;
    overflow: hidden;
    perspective: 1600px;
  }

  .curtain-gate.is-open {
    pointer-events: none;
  }

  .curtain-panel {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background-image: url('assets/curtain-mobile.jpg');
    background-size: 200% 100%;
    background-repeat: no-repeat;
    transition: transform 1.35s cubic-bezier(0.76, 0, 0.24, 1);
    box-shadow: 0 0 60px rgba(0,0,0,0.35);
  }

  @media (min-width: 768px) {
    .curtain-panel { background-image: url('assets/curtain-web.jpg'); }
  }

  .curtain-left {
    left: 0;
    background-position: left top;
    transform-origin: left center;
  }

  .curtain-right {
    right: 0;
    background-position: right top;
    transform-origin: right center;
  }

  .curtain-gate.is-open .curtain-left {
    transform: translateX(-102%) rotateY(-18deg) scale(1.04);
  }

  .curtain-gate.is-open .curtain-right {
    transform: translateX(102%) rotateY(18deg) scale(1.04);
    transition-delay: 0.07s;
  }

  .curtain-flare {
    position: absolute;
    top: 38%;
    left: 50%;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,238,215,0.95), rgba(255,170,140,0.35) 45%, transparent 72%);
    transform: translate(-50%, -50%) scale(0.3);
    opacity: 0;
    z-index: 1;
    pointer-events: none;
  }

  .curtain-gate.is-open .curtain-flare {
    animation: flare-burst 1.3s ease-out forwards;
  }

  @keyframes flare-burst {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    35% { opacity: 1; transform: translate(-50%, -50%) scale(2.6); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(4.2); }
  }

  .curtain-cta {
    position: absolute;
    left: 50%;
    bottom: 14%;
    transform: translateX(-50%);
    background: none;
    border: 1px solid rgba(251,246,236,0.55);
    border-radius: 999px;
    padding: 13px 28px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #FBF6EC;
    cursor: pointer;
    z-index: 3;
    animation: pulse 2.6s ease-in-out infinite;
    transition: opacity 0.35s ease;
  }

  .curtain-gate.is-open .curtain-cta {
    animation: none;
    opacity: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }

  @media (max-width: 480px) {
    .curtain-cta { bottom: 10%; padding: 12px 22px; font-size: 11px; }
  }

  /* ---------- Hero ---------- */

  .hero {
    background-image: radial-gradient(ellipse at 50% 0%, rgba(80,1,5,0.05), transparent 60%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    text-align: center;
    position: relative;
  }

  .hero-headline {
    font-family: 'Pinyon Script', cursive;
    font-weight: 400;
    font-size: 124px;
    line-height: 1;
    color: #FFFDF9;
    text-shadow: 0 2px 3px rgba(80,1,5,0.10), 0 1px 0 rgba(255,255,255,0.6);
    margin: 0 0 28px;
  }

  .hero-headline .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(28px) rotate(-5deg);
    animation: letter-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes letter-in {
    to { opacity: 1; transform: translateY(0) rotate(0deg); }
  }

  .hero-plaque-wrap {
    position: relative;
    width: min(98vw, 680px);
    opacity: 0;
    transform: translateY(18px) scale(0.98);
    animation: rise-scale 1.1s ease-out 0.55s forwards;
  }

  .hero-card-layer {
    position: relative;
    z-index: 2;
    width: 100%;
    transition: transform 0.1s linear;
  }

  .hero-plaque {
    display: block;
    width: 100%;
    height: auto;
  }

  .hero-envelope-layer {
    position: absolute;
    top: -4%;
    right: -14%;
    width: 82%;
    z-index: 1;
    transition: transform 0.1s linear, opacity 0.1s linear;
  }

  .hero-envelope-layer img {
    display: block;
    width: 100%;
    height: auto;
  }

  .hero-floral {
    position: absolute;
    top: -11%;
    left: -15%;
    width: 36%;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transform: rotate(-20deg) scale(0.8);
    transform-origin: 30% 90%;
    animation: hero-floral-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
  }

  .hero-floral img {
    display: block;
    width: 100%;
    height: auto;
    animation: sway 8s ease-in-out 2s infinite;
  }

  @keyframes hero-floral-in {
    to { opacity: 1; transform: rotate(-13deg) scale(1); }
  }

  .hero-orchid {
    position: absolute;
    top: -9%;
    right: -17%;
    width: 42%;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transform: rotate(16deg) scale(0.8);
    transform-origin: 20% 70%;
    animation: hero-orchid-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
  }

  .hero-orchid img {
    display: block;
    width: 100%;
    height: auto;
    mix-blend-mode: multiply;
    animation: sway 9s ease-in-out 2.2s infinite;
  }

  @keyframes hero-orchid-in {
    to { opacity: 1; transform: rotate(9deg) scale(1); }
  }

  .hero-vinyl {
    position: absolute;
    bottom: -7%;
    right: -11%;
    width: 32%;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transform: rotate(24deg) scale(0.75);
    animation: hero-vinyl-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
  }

  .hero-vinyl img {
    display: block;
    width: 100%;
    height: auto;
    animation: vinyl-spin 9s linear infinite;
  }

  @keyframes hero-vinyl-in {
    to { opacity: 0.94; transform: rotate(15deg) scale(1); }
  }

  @keyframes vinyl-spin {
    to { transform: rotate(360deg); }
  }

  .hero-fan {
    position: absolute;
    bottom: -5%;
    left: -13%;
    width: 34%;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transform-origin: 84% 86%;
    transform: rotate(-38deg) scale(0.78);
    animation: hero-fan-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 1.35s forwards;
  }

  .hero-fan img {
    display: block;
    width: 100%;
    height: auto;
    transform-origin: 84% 86%;
    animation: fan-wave 2.1s ease-in-out 2.45s infinite;
  }

  @keyframes hero-fan-in {
    to { opacity: 1; transform: rotate(-16deg) scale(1); }
  }

  @keyframes fan-wave {
    0%, 100% { transform: rotate(-7deg); }
    50% { transform: rotate(7deg); }
  }

  @media (max-width: 480px) {
    .hero-floral { width: 34%; top: -8%; left: -10%; }
    .hero-orchid { width: 36%; top: -6%; right: -12%; }
    .hero-vinyl { width: 28%; bottom: -5%; right: -8%; }
    .hero-fan { width: 30%; bottom: -4%; left: -9%; }
  }

  .hero-scroll-cue {
    margin-top: 40px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(51,41,31,0.45);
    opacity: 0;
    animation: fade-in 1s ease-out 2.2s forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes rise-scale {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fade-in {
    to { opacity: 1; }
  }

  @media (max-width: 480px) {
    .hero-headline { font-size: 80px; }
  }

  /* ---------- Scroll-reveal (shared) ---------- */

  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.8s ease-out, transform 0.8s ease-out;
  }

  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- RSVP ---------- */

  .rsvp-wrap {
    position: relative;
    text-align: center;
    padding: 0 32px 116px;
  }

  .rsvp-drape-spacer {
    width: 100%;
    aspect-ratio: 1376 / 768;
  }

  .rsvp-wrap::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    aspect-ratio: 1376 / 768;
    background-image: url('assets/drapery.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    z-index: 0;
    opacity: 0.92;
  }

  .rsvp-wrap > * {
    position: relative;
    z-index: 1;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(6deg) scale(1); }
    50% { transform: rotate(2deg) scale(1.015); }
  }

  .rsvp-headline {
    font-family: 'Pinyon Script', cursive;
    font-weight: 400;
    font-size: 64px;
    color: var(--cream);
    margin: -34% 0 14px;
  }

  .rsvp-question {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 21px;
    margin: 0 0 40px;
    color: rgba(251,246,236,0.9);
  }

  .rsvp-toggle {
    position: relative;
    display: inline-flex;
    background: rgba(251,246,236,0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(251,246,236,0.3);
    border-radius: 999px;
    padding: 6px;
    max-width: 100%;
  }

  .rsvp-toggle-thumb {
    position: absolute;
    top: 6px;
    bottom: 6px;
    left: 6px;
    width: 0;
    background: var(--cream);
    border-radius: 999px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), width 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    opacity: 0;
    z-index: 0;
  }

  .rsvp-toggle.has-selection .rsvp-toggle-thumb {
    opacity: 1;
  }

  .rsvp-btn {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 14px 22px;
    background: none;
    border: none;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    white-space: nowrap;
    color: var(--cream);
    cursor: pointer;
    transition: color 0.35s ease;
  }

  .rsvp-icon {
    width: 20px;
    height: 20px;
    color: currentColor;
    flex: none;
    transition: color 0.35s ease;
  }

  .rsvp-btn.selected {
    color: var(--maroon);
  }

  @media (max-width: 380px) {
    .rsvp-btn { padding: 12px 12px; font-size: 11.5px; gap: 6px; }
    .rsvp-icon { width: 17px; height: 17px; }
  }

  .rsvp-confirm {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--cream);
    margin: 26px 0 0;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .rsvp-confirm.show {
    opacity: 1;
    transform: translateY(0);
  }

  .rsvp-stamp {
    display: block;
    width: 84px;
    height: auto;
    margin: 20px auto 0;
    opacity: 0;
    transform: scale(2.4) rotate(-22deg);
    filter: drop-shadow(0 3px 6px rgba(42,1,3,0.25));
    transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .rsvp-stamp.show {
    opacity: 1;
    transform: scale(1) rotate(-6deg);
    animation: seal-glow 2.6s ease-in-out 0.55s infinite;
  }

  @keyframes seal-glow {
    0%, 100% { filter: drop-shadow(0 3px 6px rgba(42,1,3,0.25)) brightness(1); }
    50% { filter: drop-shadow(0 3px 12px rgba(106,125,70,0.5)) brightness(1.1); }
  }

  @media (max-width: 420px) {
    .rsvp-wrap { padding: 180px 24px 80px; }
    .rsvp-headline { font-size: 42px; }
  }

  .petal {
    position: fixed;
    width: 9px;
    height: 11px;
    border-radius: 60% 60% 60% 0;
    pointer-events: none;
    z-index: 500;
    opacity: 0;
    transform: translate(-50%, -50%);
    animation: petal-burst 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes petal-burst {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(0deg); }
    15% { opacity: 1; }
    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 80px)) scale(1) rotate(var(--rot));
    }
  }

  /* ---------- Countdown ---------- */

  .countdown {
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(80,1,5,0.14);
    color: var(--ink);
    text-align: center;
    padding: 64px 24px;
    max-width: 980px;
    width: calc(100% - 32px);
    margin: 0 auto 56px;
    border-radius: 28px;
  }

  .countdown-headline {
    font-family: 'Pinyon Script', cursive;
    font-weight: 400;
    font-size: 48px;
    margin: 0 0 28px;
    color: var(--maroon);
  }

  .countdown-timer {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 18px;
    max-width: 420px;
    margin: 0 auto;
  }

  .time-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 56px;
  }

  .time-block .value {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--maroon);
    font-variant-numeric: tabular-nums;
  }

  .time-block .label {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--olive);
    margin-top: 8px;
  }

  .countdown-colon {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 30px;
    line-height: 1;
    color: rgba(80,1,5,0.25);
    padding-top: 2px;
  }

  @media (max-width: 420px) {
    .countdown-headline { font-size: 34px; }
    .countdown-timer { gap: 8px; }
    .time-block { min-width: 44px; }
    .time-block .value { font-size: 26px; }
    .time-block .label { font-size: 9px; letter-spacing: 0.12em; }
    .countdown-colon { font-size: 22px; }
  }

  /* ---------- Schedule ---------- */

  .schedule {
    background-image: url('assets/schedule-bg.jpg');
    background-size: cover;
    background-position: center 30%;
    color: #F3F0E6;
    text-align: center;
    padding: 76px 24px;
    position: relative;
    overflow: hidden;
    max-width: 980px;
    width: calc(100% - 32px);
    margin: 0 auto 56px;
    border-radius: 28px;
  }

  .schedule::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(51, 61, 31, 0.86);
    z-index: 0;
  }

  .schedule-headline {
    position: relative;
    z-index: 1;
    font-family: 'Pinyon Script', cursive;
    font-weight: 400;
    font-size: 46px;
    color: #F3F0E6;
    margin: 0 0 44px;
  }

  .schedule-list {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 30px;
    max-width: 320px;
    margin: 0 auto;
  }

  .schedule-row {
    display: grid;
    grid-template-columns: 56px 10px 1fr;
    align-items: center;
    column-gap: 16px;
  }

  .schedule-time {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: #F3F0E6;
    text-align: left;
    font-variant-numeric: tabular-nums;
  }

  .schedule-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(243,240,230,0.55);
    justify-self: center;
  }

  .schedule-label-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .schedule-label {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(243,240,230,0.78);
    text-align: left;
  }

  .schedule-icon {
    width: 20px;
    height: 20px;
    flex: none;
    color: rgba(243,240,230,0.7);
  }

  .schedule-flourish {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 46px;
  }

  .schedule-flourish span {
    display: block;
    width: 40px;
    height: 1px;
    background: rgba(243,240,230,0.35);
  }

  .schedule-flourish .diamond {
    width: 6px;
    height: 6px;
    background: rgba(243,240,230,0.5);
    transform: rotate(45deg);
  }

  @media (max-width: 420px) {
    .schedule-headline { font-size: 36px; }
  }

  /* ---------- Location ---------- */

  .location {
    text-align: center;
    padding: 72px 32px;
  }

  .location-eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--olive);
    margin: 0 0 18px;
  }

  .location-place {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 30px;
    color: var(--maroon);
    margin: 0 0 10px;
  }

  .location-address {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: rgba(51,41,31,0.6);
    margin: 0;
  }


</style>
</head>
<body>

  <div class="curtain-gate" id="curtainGate">
    <div class="curtain-flare"></div>
    <div class="curtain-panel curtain-left"></div>
    <div class="curtain-panel curtain-right"></div>
    <button class="curtain-cta" id="curtainCta" type="button">Click to open the invitation</button>
  </div>

  <section class="hero">
    <h1 class="hero-headline" aria-label="Save the Date"><span aria-hidden="true"><span class="letter" style="animation-delay:0.10s">S</span><span class="letter" style="animation-delay:0.14s">a</span><span class="letter" style="animation-delay:0.18s">v</span><span class="letter" style="animation-delay:0.22s">e</span> <span class="letter" style="animation-delay:0.30s">t</span><span class="letter" style="animation-delay:0.34s">h</span><span class="letter" style="animation-delay:0.38s">e</span> <span class="letter" style="animation-delay:0.46s">D</span><span class="letter" style="animation-delay:0.50s">a</span><span class="letter" style="animation-delay:0.54s">t</span><span class="letter" style="animation-delay:0.58s">e</span></span></h1>

    <div class="hero-plaque-wrap" id="heroPlaqueWrap">
      <div class="hero-envelope-layer" id="heroEnvelopeLayer">
        <img src="assets/hero-envelope.png" alt="" />
      </div>

      <div class="hero-card-layer" id="heroCardLayer">
        <img class="hero-plaque" src="assets/hero-card.png" alt="Tornike &amp; Liza — Celebrating love — September 5, 2026" />
      </div>

      <div class="hero-floral">
        <img src="assets/flowers.png" alt="" />
      </div>
      <div class="hero-orchid">
        <img src="assets/orchid.png" alt="" />
      </div>
      <div class="hero-vinyl">
        <img src="assets/vinyl.png" alt="" />
      </div>

      <div class="hero-fan">
        <img src="assets/fan.png" alt="" />
      </div>
    </div>

    <p class="hero-scroll-cue">Scroll</p>
  </section>

  <section class="rsvp-wrap reveal">
    <div class="rsvp-drape-spacer"></div>
    <h2 class="rsvp-headline">R.S.V.P.</h2>
    <p class="rsvp-question">Will you be joining us?</p>
    <div class="rsvp-toggle" id="rsvpToggle">
      <div class="rsvp-toggle-thumb" id="rsvpThumb"></div>
      <button class="rsvp-btn" data-value="yes" type="button">
        <svg class="rsvp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20s-7.5-4.6-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 5c-2 4.4-9.5 9-9.5 9z"/>
        </svg>
        <span class="rsvp-btn-label">With pleasure</span>
      </button>
      <button class="rsvp-btn" data-value="no" type="button">
        <svg class="rsvp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="13" rx="1.5"/>
          <path d="M3.5 7l8.5 6 8.5-6"/>
        </svg>
        <span class="rsvp-btn-label">Regretfully declines</span>
      </button>
    </div>
    <p class="rsvp-confirm" id="confirm"></p>
    <img class="rsvp-stamp" id="rsvpStamp" src="assets/candle.png" alt="" />
  </section>

  <section class="schedule reveal">
    <h2 class="schedule-headline">The Program</h2>
    <div class="schedule-list">
      <div class="schedule-row">
        <span class="schedule-time">15:00</span>
        <span class="schedule-dot"></span>
        <span class="schedule-label-wrap">
          <span class="schedule-label">Guest Arrival</span>
          <svg class="schedule-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s7-7.58 7-12A7 7 0 1 0 5 9c0 4.42 7 12 7 12z"/>
            <circle cx="12" cy="9" r="2.3"/>
          </svg>
        </span>
      </div>
      <div class="schedule-row">
        <span class="schedule-time">16:00</span>
        <span class="schedule-dot"></span>
        <span class="schedule-label-wrap">
          <span class="schedule-label">Ceremony</span>
          <svg class="schedule-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="14" r="6"/>
            <circle cx="15" cy="14" r="6"/>
          </svg>
        </span>
      </div>
      <div class="schedule-row">
        <span class="schedule-time">17:00</span>
        <span class="schedule-dot"></span>
        <span class="schedule-label-wrap">
          <span class="schedule-label">Reception</span>
          <svg class="schedule-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3h8l-2.2 9.5a1.8 1.8 0 0 1-3.6 0L8 3z"/>
            <path d="M12 12.5V20M8.5 20h7"/>
          </svg>
        </span>
      </div>
    </div>

    <div class="schedule-flourish">
      <span></span><span class="diamond"></span><span></span>
    </div>
  </section>

  <section class="countdown reveal">
    <h2 class="countdown-headline">Forever starts in</h2>
    <div class="countdown-timer">
      <div class="time-block">
        <span class="value" id="cd-days">--</span>
        <span class="label">Days</span>
      </div>
      <span class="countdown-colon">:</span>
      <div class="time-block">
        <span class="value" id="cd-hours">--</span>
        <span class="label">Hours</span>
      </div>
      <span class="countdown-colon">:</span>
      <div class="time-block">
        <span class="value" id="cd-mins">--</span>
        <span class="label">Minutes</span>
      </div>
      <span class="countdown-colon">:</span>
      <div class="time-block">
        <span class="value" id="cd-secs">--</span>
        <span class="label">Seconds</span>
      </div>
    </div>
  </section>

  <section class="location reveal">
    <p class="location-eyebrow">The Venue</p>
    <p class="location-place">[Venue name to come]</p>
    <p class="location-address">[Address / directions to come]</p>
  </section>


  <script>
    // ---------- Curtain gate ----------
    const curtainGate = document.getElementById('curtainGate');

    document.documentElement.classList.add('curtain-locked');

    function openCurtains() {
      curtainGate.classList.add('is-open');
      document.documentElement.classList.remove('curtain-locked');
      setTimeout(() => {
        curtainGate.style.display = 'none';
      }, 1450);
    }

    curtainGate.addEventListener('click', openCurtains);

    // ---------- RSVP ----------
    const buttons = document.querySelectorAll('.rsvp-btn');
    const confirm = document.getElementById('confirm');
    const rsvpStamp = document.getElementById('rsvpStamp');
    const rsvpToggle = document.getElementById('rsvpToggle');
    const rsvpThumb = document.getElementById('rsvpThumb');

    function moveThumbTo(btn) {
      const toggleRect = rsvpToggle.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      rsvpThumb.style.width = btnRect.width + 'px';
      rsvpThumb.style.transform = `translateX(${btnRect.left - toggleRect.left - 6}px)`;
      rsvpToggle.classList.add('has-selection');
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        moveThumbTo(btn);

        const value = btn.dataset.value;
        confirm.textContent = value === 'yes'
          ? 'Thank you — we can\'t wait to celebrate with you.'
          : 'Thank you for letting us know — you\'ll be missed.';
        confirm.classList.add('show');

        rsvpStamp.classList.remove('show');
        void rsvpStamp.offsetWidth; // restart the stamp animation if the answer changes
        rsvpStamp.classList.add('show');

        spawnPetals(btn);

        // TODO: wire this to the response-logging endpoint (Google Sheet via Apps Script)
        // once the guest list and hosting are finalized.
      });
    });

    window.addEventListener('resize', () => {
      const selected = document.querySelector('.rsvp-btn.selected');
      if (selected) moveThumbTo(selected);
    });

    // ---------- Petal burst ----------
    const petalColors = ['#500105', '#6A7D46', '#FBF6EC'];

    function spawnPetals(originEl) {
      const rect = originEl.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      for (let i = 0; i < 16; i++) {
        const petal = document.createElement('span');
        petal.className = 'petal';

        const angle = Math.random() * 360;
        const distance = 55 + Math.random() * 95;
        const dx = Math.cos(angle * Math.PI / 180) * distance;
        const dy = Math.sin(angle * Math.PI / 180) * distance - 30;

        petal.style.left = originX + 'px';
        petal.style.top = originY + 'px';
        petal.style.setProperty('--dx', dx + 'px');
        petal.style.setProperty('--dy', dy + 'px');
        petal.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
        petal.style.background = petalColors[i % petalColors.length];
        petal.style.animationDelay = (Math.random() * 0.12) + 's';

        document.body.appendChild(petal);
        petal.addEventListener('animationend', () => petal.remove());
      }
    }

    // ---------- Countdown ----------
    // TODO: replace with the real wedding date once you have it.
    const WEDDING_DATE = new Date('2027-08-06T16:00:00');

    const dayEl = document.getElementById('cd-days');
    const hourEl = document.getElementById('cd-hours');
    const minEl = document.getElementById('cd-mins');
    const secEl = document.getElementById('cd-secs');

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function updateCountdown() {
      const diff = WEDDING_DATE.getTime() - Date.now();
      if (diff <= 0) {
        dayEl.textContent = '00';
        hourEl.textContent = '00';
        minEl.textContent = '00';
        secEl.textContent = '00';
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      dayEl.textContent = pad(days);
      hourEl.textContent = pad(hours);
      minEl.textContent = pad(minutes);
      secEl.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // ---------- Scroll reveal ----------
    const revealEls = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    revealEls.forEach(el => observer.observe(el));

    // ---------- Hero envelope slide-away on scroll ----------
    const heroSectionEl = document.querySelector('.hero');
    const heroEnvelopeLayer = document.getElementById('heroEnvelopeLayer');
    const heroCardLayer = document.getElementById('heroCardLayer');
    let heroScrollTicking = false;

    function updateHeroScrollAnim() {
      heroScrollTicking = false;
      const rect = heroSectionEl.getBoundingClientRect();
      const range = rect.height * 0.55;
      const scrolled = Math.min(Math.max(-rect.top, 0), range);
      const progress = range > 0 ? scrolled / range : 0;

      heroEnvelopeLayer.style.transform = `translate(${progress * 55}%, ${progress * -18}%) rotate(${progress * 10}deg)`;
      heroEnvelopeLayer.style.opacity = String(1 - progress);

      heroCardLayer.style.transform = `translateX(${progress * -6}%) scale(${1 + progress * 0.08})`;
    }

    window.addEventListener('scroll', () => {
      if (!heroScrollTicking) {
        heroScrollTicking = true;
        requestAnimationFrame(updateHeroScrollAnim);
      }
    }, { passive: true });

    updateHeroScrollAnim();
  </script>

</body>
</html>
